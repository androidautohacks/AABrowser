name: Upstream AABrowser Sync Check

# Checks kododake/AABrowser (upstream) against this fork's latest release.
# Writes the result to data/upstream-sync-status.json so the About/Credits
# page on aabrowser.app can display honest, current version parity info.
# When behind, syncs the missing tag + Release (including assets) from
# upstream onto this fork, then opens/closes a tracking issue based on
# whether that sync actually succeeded.

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC. adjust cadence as needed
  workflow_dispatch: {}     # allows manual trigger from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync-check
  cancel-in-progress: false   # let an in-flight run finish rather than racing it

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed so upstream tags can be resolved/pushed

      - name: Fetch upstream and fork release data
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upstream_json=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kododake/AABrowser/releases/latest)
          fork_json=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/androidautohacks/AABrowser/releases/latest)
          upstream_version=$(echo "$upstream_json" | jq -r '.tag_name // "unknown"')
          upstream_published=$(echo "$upstream_json" | jq -r '.published_at // "unknown"')
          fork_version=$(echo "$fork_json" | jq -r '.tag_name // "unknown"')
          fork_published=$(echo "$fork_json" | jq -r '.published_at // "unknown"')
          if [ "$upstream_version" = "$fork_version" ]; then
            status="in_sync"
          else
            status="behind"
          fi
          checked_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p data
          cat > data/upstream-sync-status.json <<EOF
          {
            "upstream_repo": "kododake/AABrowser",
            "upstream_version": "$upstream_version",
            "upstream_published_at": "$upstream_published",
            "fork_repo": "androidautohacks/AABrowser",
            "fork_version": "$fork_version",
            "fork_published_at": "$fork_published",
            "sync_status": "$status",
            "checked_at": "$checked_at"
          }
          EOF
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "fork_version=$fork_version" >> "$GITHUB_OUTPUT"

      - name: Sync tag and release from upstream
        if: steps.fetch.outputs.status == 'behind'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.fetch.outputs.upstream_version }}"

          git remote add upstream https://github.com/kododake/AABrowser.git
          git fetch upstream --tags

          # push the tag to the fork if it isn't already there
          if ! git ls-remote --tags origin | grep -q "refs/tags/$tag$"; then
            git push origin "refs/tags/$tag"
          fi

          # skip if a release for this tag already exists on the fork
          if gh release view "$tag" --repo androidautohacks/AABrowser >/dev/null 2>&1; then
            echo "Release $tag already exists on fork, skipping creation"
            exit 0
          fi

          title=$(gh release view "$tag" --repo kododake/AABrowser --json name -q '.name')
          body=$(gh release view "$tag" --repo kododake/AABrowser --json body -q '.body')
          is_prerelease=$(gh release view "$tag" --repo kododake/AABrowser --json isPrerelease -q '.isPrerelease')

          # target the exact tagged commit, not main's tip, so the release
          # can never point at code main happens to have drifted to
          flags=(--repo androidautohacks/AABrowser --title "$title" --notes "$body")
          [ "$is_prerelease" = "true" ] && flags+=(--prerelease)

          gh release create "$tag" "${flags[@]}"

          mkdir -p ./upstream-assets
          gh release download "$tag" --repo kododake/AABrowser --dir ./upstream-assets || true
          if [ -n "$(ls -A ./upstream-assets 2>/dev/null)" ]; then
            gh release upload "$tag" --repo androidautohacks/AABrowser ./upstream-assets/*
          fi

      - name: Commit updated status file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase --autostash
          git add data/upstream-sync-status.json
          git diff --cached --quiet && echo "No change" || git commit -m "chore: update upstream sync status"
          git push origin main

      - name: Open issue if fork is behind
        if: steps.fetch.outputs.status == 'behind'
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = "${{ steps.fetch.outputs.upstream_version }}";
            const fork = "${{ steps.fetch.outputs.fork_version }}";
            const title = "Upstream sync: fork is behind kododake/AABrowser";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "upstream-sync"
            });
            if (existing.length > 0) {
              return; // already tracked, don't spam a new issue
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["upstream-sync"],
              body: `Upstream (kododake/AABrowser) is at **${upstream}**, this fork was at **${fork}**.\n\nThe workflow has attempted to sync the tag and release automatically. If this issue is still open on the next run, check the workflow logs — the automatic sync may have failed (e.g. missing tag, missing assets, or a permission issue).`
            });

      - name: Close tracking issue if back in sync
        if: steps.fetch.outputs.status == 'in_sync'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "upstream-sync"
            });
            for (const issue of existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Fork is back in sync with upstream. Closing automatically."
              });
            }
